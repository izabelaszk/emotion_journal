name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # src/ imports torch and whisper at module level, so the unit tests need
      # them installed; the CPU wheel keeps the install small. No models are downloaded.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -m "not integration"
